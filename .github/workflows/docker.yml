name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试（含与上游 JS 的逐字节比对）
        run: go test ./...

      # 防止 tag 与源码版本号漂移：v1.0.1 必须对应 version.go 里的 1.0.1
      - name: 校验 tag 与 version.go 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' version.go | head -1)
          if [ "v${V}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 version.go 的 v${V} 不一致"
            exit 1
          fi

  build:
    # 只在版本 tag 上构建镜像：main 分支只跑测试，不产出 :main / :sha-* 这类无意义 tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库配了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 才双推，没配就只推 GHCR（不报错）
      - name: 登录 Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: 计算镜像坐标
        id: coords
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGES="ghcr.io/${OWNER}/workbuddy-daily"
          if [ -n "${DH_TOKEN}" ]; then
            IMAGES="${IMAGES},${DH_USER}/workbuddy-daily"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "推送目标：${IMAGES}"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.coords.outputs.images }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
